name: Logging CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logging-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install disposable storage harness
        run: npm ci --prefix scripts/logging
      - name: Restore Logging
        run: dotnet restore Solus.Logging.slnx
      - name: Build Logging
        run: dotnet build Solus.Logging.slnx -c Release --no-restore
      - name: Test Logging contracts, delivery, Supabase and architecture
        run: dotnet test tests/Solus.Logging.Tests/Solus.Logging.Tests.csproj -c Release --no-build
      - name: Test CLI acceptance and emit maximum input fixture
        run: dotnet test tests/Solus.Logging.Tests/Solus.Logging.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Cli"
      - name: Build Linux x64 managed CLI payload
        run: node scripts/logging/build-payload.ts --output artifacts/logging-cli
      - name: Exercise actual Action and CLI over controlled HTTPS and real SQL
        run: node --test tests/logging-action/*.test.ts
      - name: Synthetic prior product failure
        id: prior-product
        continue-on-error: true
        run: exit 7
      - name: Real local Action after failed product step
        id: logging-after-failure
        if: always()
        uses: ./actions/logging
        with:
          telemetry-json: ''
      - name: Verify original product outcome and visible unavailable input
        if: always()
        env:
          PRIOR_OUTCOME: ${{ steps.prior-product.outcome }}
          DELIVERY_STATUS: ${{ steps.logging-after-failure.outputs.delivery-status }}
          DIAGNOSTIC_CODE: ${{ steps.logging-after-failure.outputs.diagnostic-code }}
        run: |
          test "$PRIOR_OUTCOME" = failure
          test "$DELIVERY_STATUS" = skipped
          test "$DIAGNOSTIC_CODE" = input_unavailable
      - name: Verify real disposable PostgreSQL storage
        run: node scripts/logging/verify-storage.ts --local
      - name: Restore Agent
        run: dotnet restore SolusAgent.slnx
      - name: Build Agent
        run: dotnet build SolusAgent.slnx -c Release --no-restore
      - name: Preserve exact Agent boundaries
        run: dotnet test tests/SolusAgent.ContractTests/SolusAgent.ContractTests.csproj -c Release --no-build --filter "FullyQualifiedName~SolusAgent.ContractTests.Architecture"
