        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts read 8
      - name: Fixed authenticated readback 9 of 10
        id: read_9
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.read_8.outcome == 'success' }}
        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts read 9
      - name: Fixed authenticated readback 10 of 10
        id: read_10
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.read_9.outcome == 'success' }}
        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts read 10
      - name: Seal complete bounded metadata proof without raw secrets or state
        id: report
        if: ${{ always() && !cancelled() && steps.read_10.outcome == 'success' }}
        run: node scripts/logging/live-qualification.ts report
      - name: Retain metadata only
        if: ${{ steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: solus-logging-live-proof
          path: ${{ runner.temp }}/solus-logging-live-proof.json
          if-no-files-found: error
          retention-days: 3

  prepare:
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out selected source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact accepted main revision and internal version
        env:
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          [[ "$SELECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SELECTED_VERSION" =~ ^0\.1\.0-internal\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          git merge-base --is-ancestor "$SELECTED_SOURCE" origin/main
          test -z "$(git status --porcelain)"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install disposable controlled storage harness
        run: npm ci --prefix scripts/logging
      - name: Prepare unuploaded candidates with separate never-published API source fixture
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: node scripts/logging/pack.ts --version "$SELECTED_VERSION" --output artifacts/logging-packages
      - name: Qualify fresh installed consumers through actual uploader and SQL
        run: node scripts/logging/verify-consumers.ts --feed artifacts/logging-packages --manifest artifacts/logging-release.json --scenario all --report artifacts/logging-consumer-proof.json
      - name: Check input selection and refusal gates
        run: node --test scripts/logging/consumption.test.ts
      - name: Print reviewable candidate metadata and explicit evidence boundary
        run: |
          cat artifacts/logging-release.json artifacts/logging-consumer-proof.json
          echo 'PREPARED ONLY. API source fixture is not genuine private .4 byte/access evidence. No package, CLI blob, tag, ACL or release was published.'

  inspect-cli-upload:
    if: inputs.mode == 'inspect-cli-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    concurrency:
      group: logging-original-c96-publisher
      cancel-in-progress: false
    steps:
      - name: Bind single run10 CLI incident observation before credential access
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected-operation-head }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          SELECTED_MEMBER: ${{ inputs.member }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY:$GITHUB_REPOSITORY_ID" = SolusQuest/solus-agent:1406091678
          test "$GITHUB_REF" = refs/heads/codex/l1-123-logging-publication
          test "$GITHUB_RUN_ATTEMPT:$GITHUB_RUN_NUMBER:$GITHUB_ACTOR_ID" = 1:10:16307884
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED" = "$GITHUB_SHA"
          test "$EXPECTED" = "$WORKFLOW_SHA"
          test "$SELECTED_SOURCE" = c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          test "$SELECTED_VERSION" = 0.1.0-internal.1
          test "$SELECTED_MEMBER" = CLI
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          architecture: x64
      - name: Observe one upload session Location shape without uploading bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_OPERATION_HEAD: ${{ inputs.expected-operation-head }}
          EXACT_MODE: ${{ inputs.mode }}
          EXACT_MEMBER: ${{ inputs.member }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
        run: node scripts/logging/inspect-cli-upload.ts

  reconcile-contracts:
    if: inputs.mode == 'reconcile-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: logging-original-c96-publisher
      cancel-in-progress: false
    steps:
      - name: Bind fixed read-only incident source before credential access
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected-operation-head }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          SELECTED_MEMBER: ${{ inputs.member }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY:$GITHUB_REPOSITORY_ID" = SolusQuest/solus-agent:1406091678
          test "$GITHUB_REF" = refs/heads/codex/l1-123-logging-publication
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED" = "$GITHUB_SHA"
          test "$EXPECTED" = "$WORKFLOW_SHA"
          test "$SELECTED_SOURCE" = c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          test "$SELECTED_VERSION" = 0.1.0-internal.1
          test "$SELECTED_MEMBER" = Solus.Telemetry.Contracts
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          path: .tmp/reconcile-c96
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          architecture: x64
      - name: Read fixed existing Contracts identity and original bytes without a writer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_OPERATION_HEAD: ${{ inputs.expected-operation-head }}
          EXACT_MODE: ${{ inputs.mode }}
          EXACT_MEMBER: ${{ inputs.member }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          EXACT_SOURCE_ROOT: ${{ github.workspace }}/.tmp/reconcile-c96
        run: node scripts/logging/reconcile-contracts.ts

  exact-operation:
    if: inputs.mode == 'validate-exact' || inputs.mode == 'publish-one'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    concurrency:
      group: logging-original-c96-publisher
      cancel-in-progress: false
    steps:
      - name: Bind exact operator source before credential access
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected-operation-head }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY:$GITHUB_REPOSITORY_ID" = SolusQuest/solus-agent:1406091678
          test "$GITHUB_REF" = refs/heads/codex/l1-123-logging-publication
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED" = "$GITHUB_SHA"
          test "$EXPECTED" = "$WORKFLOW_SHA"
          test "$SELECTED_SOURCE" = c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          test "$SELECTED_VERSION" = 0.1.0-internal.1
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          path: accepted-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original candidate and Api history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C accepted-source rev-parse HEAD)" = c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          git -C accepted-source cat-file -e cb5f5ef8fc39a24f888065052078d40722e7680b^{commit}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.109
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          architecture: x64
      - name: Validate all original bytes then execute only the selected operation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_OPERATION_HEAD: ${{ inputs.expected-operation-head }}
          EXACT_MODE: ${{ inputs.mode }}
          EXACT_MEMBER: ${{ inputs.member }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          EXACT_SOURCE_ROOT: ${{ github.workspace }}/accepted-source
        run: node scripts/logging/publish-exact.ts

  inspect-cli-readback:
    if: inputs.mode == 'inspect-cli-readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    concurrency:
      group: logging-original-c96-publisher
      cancel-in-progress: false
    steps:
      - name: Bind single run12 CLI readback observation before credential access
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected-operation-head }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          SELECTED_MEMBER: ${{ inputs.member }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY:$GITHUB_REPOSITORY_ID" = SolusQuest/solus-agent:1406091678
          test "$GITHUB_REF" = refs/heads/codex/l1-123-logging-publication
          test "$GITHUB_RUN_ATTEMPT:$GITHUB_RUN_NUMBER:$GITHUB_ACTOR_ID" = 1:12:16307884
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED" = "$GITHUB_SHA"
          test "$EXPECTED" = "$WORKFLOW_SHA"
          test "$SELECTED_SOURCE" = c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          test "$SELECTED_VERSION" = 0.1.0-internal.1
          test "$SELECTED_MEMBER" = CLI
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          architecture: x64
      - name: Read exact config via Node and fetch plus exact tag; no redirect follow or mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_OPERATION_HEAD: ${{ inputs.expected-operation-head }}
          EXACT_MODE: ${{ inputs.mode }}
          EXACT_MEMBER: ${{ inputs.member }}
          SELECTED_SOURCE: ${{ inputs.source-commit }}
          SELECTED_VERSION: ${{ inputs.version }}
        run: node scripts/logging/inspect-cli-readback.ts
