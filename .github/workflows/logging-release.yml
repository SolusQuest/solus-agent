name: Logging release preparation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preparation or separately reviewed original-byte operator action
        type: choice
        default: prepare
        options: [prepare, validate-exact, publish-one, reconcile-contracts, inspect-cli-upload, inspect-cli-readback, qualify-live]
        required: true
      expected-operation-head:
        description: Exact root-reviewed helper and workflow SHA; required for operations
        type: string
        required: false
      live-qualification-admission:
        description: Nonsecret root-reviewed one-run live qualification metadata; never credentials
        type: string
        required: false
      new-package-admission:
        description: Root-reviewed operator absence receipt for one new non-Contracts NuGet identity; blank means strict read-existing only
        type: string
        required: false
      member:
        description: One fixed original member; ignored by preparation
        type: choice
        default: Solus.Telemetry.Contracts
        options: [Solus.Telemetry.Contracts, SolusAgent.Telemetry, Solus.Logging, Solus.Logging.Supabase, CLI]
        required: true
      source-commit:
        description: Accepted main commit (full 40-character SHA)
        required: true
        type: string
      version:
        description: New immutable internal candidate version
        required: true
        default: 0.1.0-internal.1
        type: string

# Default preparation remains read-only. Exact operator authority is isolated below.
permissions:
  contents: read

jobs:
  qualify-live:
    if: inputs.mode == 'qualify-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: logging-l1-live-qualification
      cancel-in-progress: false
    env:
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject wrong actor, head, run number or missing admission before credential-use steps
        shell: bash
        run: |
          python3 - <<'PYGUARD'
          import os,json,re,time,sys
          try:
              e=os.environ
              assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_REPOSITORY']=='SolusQuest/solus-agent' and e['GITHUB_REPOSITORY_ID']=='1406091678'
              assert e['GITHUB_REF']=='refs/heads/codex/l1-124-live-qualification' and e['GITHUB_RUN_ATTEMPT']=='1'
              assert e['GITHUB_WORKFLOW_REF']=='SolusQuest/solus-agent/.github/workflows/logging-release.yml@'+e['GITHUB_REF']
              assert os.path.getsize(e['GITHUB_EVENT_PATH'])<=131072
              i=json.load(open(e['GITHUB_EVENT_PATH']))['inputs']; wire=i['live-qualification-admission']
              assert isinstance(wire,str) and len(wire.encode())<=8192
              a=json.loads(wire)
              assert i['mode']=='qualify-live' and i['member']=='CLI' and not i.get('new-package-admission')
              assert i['source-commit']=='c96a1b5cf9746a7fa569a339c583e07e3e103ee6' and i['version']=='0.1.0-internal.1'
              assert re.fullmatch('[a-f0-9]{40}',i['expected-operation-head'])
              assert i['expected-operation-head']==a['operationHead']==e['GITHUB_SHA']==e['WORKFLOW_SHA']
              assert type(a['actorId']) is int and str(a['actorId'])==e['GITHUB_ACTOR_ID']
              assert type(a['beforeWorkflowRunNumber']) is int and a['beforeWorkflowRunNumber']>0
              assert a['expectedWorkflowRunNumber']==a['beforeWorkflowRunNumber']+1 and str(a['expectedWorkflowRunNumber'])==e['GITHUB_RUN_NUMBER']
              assert a['budget']=={'posts':7,'gets':10,'rows':3}
              for k in ['originSHA256','issuerSHA256','writerASHA256','writerBSHA256','schemaEvidenceSHA256','cleanupOwnerSHA256']:
                  assert isinstance(a[k],str) and re.fullmatch('[a-f0-9]{64}',a[k])
              assert a['writerASHA256']!=a['writerBSHA256']
              assert a['notBeforeEpochMs']<=time.time()*1000<=a['expiresAtEpochMs'] and 0<a['expiresAtEpochMs']-a['notBeforeEpochMs']<=3600000
          except Exception:
              sys.exit('LIVE124_ENTRY_REFUSED')
          PYGUARD
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: SolusQuest/solus-agent
          ref: c96a1b5cf9746a7fa569a339c583e07e3e103ee6
          path: .tmp/qualification-c96
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.109
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          architecture: x64
      - name: Bind the complete one-run admission and initialize exclusive local state
        id: live_guard
        run: node scripts/logging/live-qualification.ts guard
      - name: Cold acquire original archives and install unchanged independent consumers
        id: prepare
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/logging/live-qualification.ts prepare
      - name: Emit one synthetic Scribe result and telemetry
        id: scribe
        run: node scripts/logging/live-qualification.ts emit scribe
      - name: Preserve actual APR business exit 7 and usable telemetry
        id: apr
        continue-on-error: true
        run: node scripts/logging/live-qualification.ts emit apr
      - name: Verify both immutable outputs and once-only producers independently of business conclusion
        id: records
        if: ${{ always() && !cancelled() && steps.live_guard.outcome == 'success' && steps.prepare.outcome == 'success' && steps.scribe.outcome == 'success' && steps.apr.outcome == 'failure' }}
        run: node scripts/logging/live-qualification.ts validate
      - name: Validate target and ordinary writer metadata without a Supabase request
        id: credentials
        if: ${{ always() && !cancelled() && steps.records.outcome == 'success' }}
        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts credentials
      - name: Fixed authenticated readback 1 of 10
        id: read_1
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.credentials.outcome == 'success' }}
        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts read 1
      - name: Fixed authenticated readback 2 of 10
        id: read_2
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.read_1.outcome == 'success' }}
        env:
          SUPABASE_ORIGIN: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          SUPABASE_A_JWT: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          SUPABASE_B_JWT: ${{ secrets.TELEMETRY_L1_WRITER_B_JWT }}
        run: node scripts/logging/live-qualification.ts read 2
      - name: Obtain finite pull bearer for only Action 1
        id: pull_1
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.read_2.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/logging/live-qualification.ts pull 1
      - name: Published logging Action 1 of 7
        id: send_1
        timeout-minutes: 2
        if: ${{ always() && !cancelled() && steps.pull_1.outcome == 'success' }}
        uses: SolusQuest/solus-agent/actions/logging@9d2f3777401d71fdea84ce350dd5bd6240acb7a8
        with:
          telemetry-json: ${{ steps.scribe.outputs.telemetry-json }}
          adapter: supabase
          supabase-url: ${{ secrets.TELEMETRY_L1_SUPABASE_ORIGIN }}
          supabase-publishable-key: ${{ secrets.TELEMETRY_L1_PUBLISHABLE_KEY }}
          supabase-access-token: ${{ secrets.TELEMETRY_L1_WRITER_A_JWT }}
          strict-delivery: 'false'
          maximum-attempts: '1'
          timeout-ms: '10000'
          retry-delay-ms: '0'
          cli-version: 0.1.0-internal.1
          cli-artifact-url: https://ghcr.io/v2/solusquest/solus-logging-cli/blobs/sha256:656957224f9e81ad16ba882c103eeaef51989deb77a2541ae0cab93d5f653339
          cli-artifact-sha256: 656957224f9e81ad16ba882c103eeaef51989deb77a2541ae0cab93d5f653339
          artifact-read-token: ${{ steps.pull_1.outputs.bearer }}
      - name: Require exact Action 1 status and preserve expected collision failure
        id: verify_1
        if: ${{ always() && !cancelled() && steps.send_1.outcome == 'success' }}
        env:
          DELIVERY_STATUS: ${{ steps.send_1.outputs.delivery-status }}
          DIAGNOSTIC_CODE: ${{ steps.send_1.outputs.diagnostic-code }}
        run: node scripts/logging/live-qualification.ts verify 1
      - name: Obtain finite pull bearer for only Action 2
